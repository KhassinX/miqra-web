title: Miqra
# Nombre bajo el ícono al agregar a la pantalla de inicio (apple-mobile-web-app-title).
short_name: Miqra
description: "A faithful, private reader for the Tanakh: the Hebrew Masoretic text beside a translation, verse by verse in its published wording, and a concordance that never interprets. Free, for iPhone, iPad and Mac."
url: https://miqra.khassinx.com
lang: en

org_legal_name: "KHASSINX LLC"
org_founding_date: "2026-06-01"

# Sin app_store_url: la app está en TestFlight. La portada muestra `availability` en lugar del badge.

# Íconos del brand pack de Miqra (el rollo de la Torá: dos rodillos dorados y el pergamino).
favicon_svg: /assets/favicons/favicon.svg
favicon_32: /assets/favicons/favicon-32.png
favicon_16: /assets/favicons/favicon-16.png
apple_touch_icon: /assets/favicons/apple-touch-icon.png

og_image_default:
  en: /assets/social/EN/og-image.png
  es: /assets/social/ES/og-image.png
og_image_alt:
  en: "Miqra app icon beside the name and the line “The Tanakh, as it is read.” (miqra.khassinx.com)"
  es: "Icono de Miqra junto al nombre y la frase «El Tanaj, como se lee.» (miqra.khassinx.com)"

# JSON-LD MobileApplication de la portada. Datos de la app (ScriptureSuite: Miqra.xcodeproj, ficha de tienda).
app_schema:
  name: "Miqra"
  operating_system: "iOS 27, iPadOS 27, macOS 27"
  category: ReferenceApplication
  price: "0"
  price_currency: USD
  offer_category: Free
  languages: ["en", "es"]
  free: true

