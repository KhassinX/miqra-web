# MiqraReaderScreen.swift (ediciones, créditos, nombre divino), Corpus/Miqra/SOURCES.md, ConcordanceKit
# (NLContextualEmbedding: ordena, no genera), ReadingMode.swift (seis modos), SyncKit (CloudKit privado),
# MiqraWidgetBundle.swift y MiqraShortcuts.swift; legal/index.md y legal/privacy.md de esta web.
# Gratis y sin compra: Miqra-macOS.entitlements y SettingsScreen.swift (1.0.0 no vende).
en:
  h1: "The Tanakh, as it is read."
  lead: "A faithful, private reader for the Tanakh, on iPhone, iPad and Mac. It takes you to the verse and never interprets it."
  availability: "Coming to the App Store · Free · For iPhone, iPad and Mac"
  facts_label: "Privacy at a glance"
  facts:
    - "Data Not Collected"
    - "No account"
    - "On‑device search"
  aside:
    - { k: "24 books", v: "Torah, Nevi’im and Ketuvim, in the traditional order" }
    - { k: "Hebrew", v: "The Masoretic text with cantillation, beside the translation you choose" }
    - { k: "Verbatim", v: "Every verse in its published wording, with its edition credited by name" }
  privacy_h: "Privacy"
  manifest:
    - { k: "Data collected", v: "None. App Store label: “Data Not Collected”" }
    - { k: "Account", v: "None" }
    - { k: "Where your data lives", v: "On your device, synced through your own iCloud" }
    - { k: "Tracking", v: "None. No analytics and no ads" }
    - { k: "Search", v: "A model from Apple that runs on your device and generates no text. Your questions never leave your device" }
    - { k: "Price", v: "Free, with no purchase" }
  policy: "Privacy Policy"
  reach: "What does reach us: the emails you send us and, only if you choose to share analytics with app developers, the crash reports and usage statistics Apple collects for the app. Never what you read, search, or write."
  inside_h: "What’s inside"
  inside:
    - { k: "The Hebrew original", v: "The Masoretic text with cantillation marks (Tanach with Ta’amei Hamikra, via Sefaria), in the public domain. You can hide the vowel points and cantillation on screen; the text itself never changes." }
    - { k: "Three translations", v: "English: The Holy Scriptures (JPS 1917). French: the Bible du Rabbinat 1899. Both in the public domain. Spanish: the Latin American Tanakh of Rav Yehuda Ribco, used with the author’s written permission. Or read the Hebrew alone." }
    - { k: "A concordance that never interprets", v: "Ask in your own words. On-device machine learning ranks passages by meaning, then shows you the verse verbatim. You can also search the literal text or go straight to a reference. The app does not write, paraphrase, summarize or interpret." }
    - { k: "The divine name", v: "In the English translation, choose how “the LORD” appears: as printed, Adonai, HaShem or G‑d. The Hebrew, French and Spanish always appear as published." }
    - { k: "Reading modes", v: "Paper, sepia, light, high contrast, dark and warm night, or match the device appearance. On iPhone and iPad, the reading text follows Dynamic Type." }
    - { k: "VoiceOver", v: "Reads the Hebrew in Hebrew and each translation in its own language, automatically." }
    - { k: "Widgets and Siri", v: "Passage of the Day and Continue Reading widgets, and Siri and Shortcuts actions that open a passage by its reference." }
    - { k: "Inside the app", v: "The scripture text comes bundled in the app. The search indexes are built on your device the first time you search; what is saved holds verse references and relevance vectors, never scripture text." }
  faq_h: "Frequently asked questions"
  faq:
    - q: "Is Miqra free?"
      a: "Yes. The app and all of its texts are free, with no purchase, no ads and no tracking. Miqra is offered pro bono."
    - q: "Does Miqra interpret the Tanakh?"
      a: "No. It is not a commentary or a study guide. Its concordance ranks passages by meaning and shows you each verse in its published wording; the meaning stays in the text."
    - q: "Which editions does it use?"
      a: "The Hebrew Masoretic text with cantillation (Tanach with Ta’amei Hamikra, via Sefaria), the JPS 1917 in English and the Bible du Rabbinat 1899 in French, all in the public domain, and the Latin American Spanish Tanakh of Rav Yehuda Ribco, used with the author’s written permission. The full attributions are on the Legal page of this site."
    - q: "Where are my bookmarks, highlights and notes?"
      a: "On your device, and synced through your own iCloud if you are signed in. We never have access to them. The scripture text itself is never synced: every device already carries it."
    - q: "Which devices does it run on?"
      a: "iPhone, iPad and Mac."
es:
  h1: "El Tanaj, como se lee."
  lead: "Un lector fiel y privado del Tanaj, para iPhone, iPad y Mac. Te lleva al versículo y nunca lo interpreta."
  availability: "Pronto en el App Store · Gratis · Para iPhone, iPad y Mac"
  facts_label: "Privacidad de un vistazo"
  facts:
    - '<span lang="en">Data Not Collected</span>'
    - "Sin cuenta"
    - "Búsqueda en el dispositivo"
  aside:
    - { k: "24 libros", v: "Torá, Nevi’im y Ketuvim, en el orden tradicional" }
    - { k: "Hebreo", v: "El texto masorético con cantilación, junto a la traducción que elijas" }
    - { k: "Tal cual", v: "Cada versículo en su redacción publicada, con su edición acreditada por nombre" }
  privacy_h: "Privacidad"
  manifest:
    - { k: "Datos recopilados", v: "Ninguno. Etiqueta del App Store: «<span lang=\"en\">Data Not Collected</span>»" }
    - { k: "Cuenta", v: "Ninguna" }
    - { k: "Dónde viven tus datos", v: "En tu dispositivo, sincronizados por tu propio iCloud" }
    - { k: "Rastreo", v: "Ninguno. Sin analítica y sin anuncios" }
    - { k: "Búsqueda", v: "Un modelo de Apple que corre en tu dispositivo y no genera texto. Tus preguntas nunca salen de tu dispositivo" }
    - { k: "Precio", v: "Gratis, sin compras" }
  policy: "Política de privacidad"
  reach: "Lo que sí nos llega: los correos que nos envías y, solo si eliges compartir análisis con los desarrolladores de apps, los informes de fallos y estadísticas de uso que Apple recopila de la app. Nunca lo que lees, buscas o escribes."
  inside_h: "Lo que incluye"
  inside:
    - { k: "El original hebreo", v: "El texto masorético con marcas de cantilación (<span lang=\"en\">Tanach with Ta’amei Hamikra</span>, vía Sefaria), de dominio público. Puedes ocultar en pantalla la vocalización y la cantilación; el texto en sí nunca cambia." }
    - { k: "Tres traducciones", v: "En español, el Tanaj en español latinoamericano de Rav Yehuda Ribco, con autorización escrita del autor. En inglés, The Holy Scriptures (JPS 1917). En francés, la Bible du Rabbinat 1899. Ambas de dominio público. O lee solo el hebreo." }
    - { k: "Una concordancia que nunca interpreta", v: "Pregunta con tus palabras. El aprendizaje automático en el dispositivo ordena los pasajes por significado y te muestra el versículo tal cual. También puedes buscar el texto literal o ir directo a una referencia. La app no escribe, parafrasea, resume ni interpreta." }
    - { k: "El nombre divino", v: "En la traducción inglesa, eliges cómo aparece «the LORD»: como está impreso, Adonai, HaShem o G‑d. El hebreo, el francés y el español aparecen siempre como se publicaron." }
    - { k: "Modos de lectura", v: "Papel, sepia, claro, alto contraste, oscuro y noche cálida, o seguir la apariencia del sistema. En iPhone y iPad, el texto de lectura respeta Dynamic Type." }
    - { k: "VoiceOver", v: "Lee el hebreo en hebreo y cada traducción en su propio idioma, automáticamente." }
    - { k: "Widgets y Siri", v: "Los widgets Pasaje del día y Continuar leyendo, y acciones de Siri y Atajos que abren un pasaje por su referencia." }
    - { k: "Dentro de la app", v: "El texto sagrado viene incluido en la app. Los índices de búsqueda se construyen en tu dispositivo la primera vez que buscas; lo que se guarda contiene referencias de versículos y vectores de relevancia, nunca texto sagrado." }
  faq_h: "Preguntas frecuentes"
  faq:
    - q: "¿Miqra es gratis?"
      a: "Sí. La app y todos sus textos son gratis, sin compras, sin anuncios y sin rastreo. Miqra se ofrece pro bono."
    - q: "¿Miqra interpreta el Tanaj?"
      a: "No. No es un comentario ni una guía de estudio. Su concordancia ordena los pasajes por significado y te muestra cada versículo en su redacción publicada; el sentido queda en el texto."
    - q: "¿Qué ediciones usa?"
      a: "El texto masorético hebreo con cantilación (<span lang=\"en\">Tanach with Ta’amei Hamikra</span>, vía Sefaria), la JPS 1917 en inglés y la Bible du Rabbinat 1899 en francés, todas de dominio público, y el Tanaj en español latinoamericano de Rav Yehuda Ribco, con autorización escrita del autor. Las atribuciones completas están en la página Legal de este sitio."
    - q: "¿Dónde quedan mis marcadores, resaltados y notas?"
      a: "En tu dispositivo, y sincronizados por tu propio iCloud si tienes la sesión iniciada. Nunca tenemos acceso a ellos. El texto sagrado en sí nunca se sincroniza: cada dispositivo ya lo lleva."
    - q: "¿En qué dispositivos funciona?"
      a: "En iPhone, iPad y Mac."
